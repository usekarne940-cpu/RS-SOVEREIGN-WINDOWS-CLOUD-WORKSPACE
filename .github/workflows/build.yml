name: RS Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate and package source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev requirements
        run: python -m pip install --disable-pip-version-warning -r scripts/python/requirements.txt

      - name: Run full local validation
        run: bash scripts/linux/run_tests.sh

      - name: Package source archive
        run: bash scripts/linux/package_release.sh

      - name: Upload release archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: artifacts/release/
          retention-days: 14
          if-no-files-found: error

  github-release:
    name: GitHub Release (tags only)
    needs: validate-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: artifacts/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*
          generate_release_notes: true
